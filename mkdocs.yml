site_name: Reactive Agents
site_description: A powerful, intuitive framework for building AI agents with multiple reasoning strategies
site_author: Tyler Buell
site_url: https://tylerjrbuell.github.io/reactive-agents

repo_name: tylerjrbuell/reactive-agents
repo_url: https://github.com/tylerjrbuell/reactive-agents

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - user-guide/index.md
    - Building Agents: user-guide/building-agents.md
    - Custom Tools: user-guide/custom-tools.md
    - Reasoning Strategies: user-guide/reasoning-strategies.md
    - Event System: user-guide/events.md
    - MCP Integration: user-guide/mcp-integration.md
    - Advanced Features: user-guide/advanced-features.md
  - API Reference: reference/
  - Examples:
    - examples/index.md
    - Basic Agent: examples/basic-agent.md
    - Streaming: examples/streaming.md
    - Tool Usage: examples/tool-usage.md
    - Multi-Strategy: examples/multi-strategy.md
  - Development:
    - development/index.md
    - Roadmap: development/roadmap.md
    - Contributing: development/contributing.md
    - Changelog: development/changelog.md

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.snippets:
      base_path: ["."]
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: tylerjrbuell
      repo: reactive-agents
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tylerjrbuell/reactive-agents
  version:
    provider: mike
